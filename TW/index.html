<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThinkWord</title>
    <style>
        :root {
            --bg: #0f172a;
            --bg-elev: #1e293b;
            --card: #1e293b;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #334155;
            --primary: #38bdf8; /* bright sky blue */
            --primary-600: #0284c7;
            --primary-100: #0c4a6e;
            --success: #22c55e;
            --error: #ef4444;
            --info: #60a5fa;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.3), 0 4px 10px rgba(0, 0, 0, 0.2);
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-elev);
        }

        #toast-messages-window {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            pointer-events: none;
        }
        .toast {
            padding: 10px 20px;
            border-radius: 5px;
            color: var(--text);
            margin-bottom: 10px;
            min-width: 200px;
            background-color: var(--muted);
        }
        .toast.success {
            background-color: var(--success);
        }
        .toast.error {
            background-color: var(--error);
        }
        .toast.info {
            background-color: var(--info);
        }


        button, input {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid var(--border);
        }
        button {
            background-color: var(--muted);
        }

        .tela {
            display: none;
            height: 100%;
            width: 100%;
            max-width: 600px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--bg);
            color: var(--text);
        }
        .tela.ativa {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #tela-main {
            display: flex;
            width: 80%;
            height: 80%;
            max-width: 500px;
            max-height: 800px;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            border-radius: 20px;
            box-shadow: 4px 4px 20px 12px #ffffff17;
        }

        #name-input-block, #room-list-block {
            background-color: var(--bg-elev);
            padding: 10px;
            border-radius: 5px;
        }

        #name-input-block {

        }

        #room-list-block {
            flex: 1;
            height: 0;
        }

        #room-list-container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        #room-list-header {
        }

        #room-list-content {
            flex: 1;
            overflow: auto;
            scrollbar-width: thin;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .rl-room {
            background-color: var(--bg);
            padding: 5px;
            border-radius: 5px;
        }

        .rl-room-info > div {
            display: flex;
            flex-direction: row;
            gap: 10px;
            width: 100%;
            overflow: auto;
            scrollbar-width: thin;
        }



        /* GAME ROOM */

        #tela-room {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 4px;
            box-shadow: 4px 4px 20px 12px #ffffff17;
        }

        #room-header-content {
            display: flex;
            justify-content: space-between;
            
        }
        #room-ins-content {
            height: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #room-ins-footer {
            
        }


        #room-ins-gamestate {
            
        }

        #room-ins-game {
            height: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #room-ins-playertyping {
            background-color: var(--border);
            text-align: center;
            font-weight: bold;
        }

        #room-ins-players, #room-ins-chat {
            border-radius: 5px;
            padding: 10px;
            background-color: var(--bg-elev);
            display: flex;
            gap: 10px;
            width: 100%;
            scrollbar-width: thin;
        }

        #room-ins-players {
            text-wrap: nowrap;
            border-bottom: 1px solid white;
            overflow-x: auto;
        }

        #room-ins-players > .me {
            box-shadow: 0px 0px 20px 0px #ffffffd6;
        }
        #room-ins-players > .playing {
            background-color: var(--text);
            padding: 2px;
            border-radius: 5px;
            color: var(--bg);
        }

        span.username {
            font-style: italic;
        }

        #room-ins-chat {
            height: 0;
            flex: 1;
            flex-direction: column;
            overflow-y: auto;
        }


        #room-ins-chat p {
            padding: 5px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
        }
        #room-ins-chat > .right > p {
            background-color: var(--primary);
        }
        #room-ins-chat > .other > p {
            background-color: var(--info);
        }
        #room-ins-chat > .center > p {
            background-color: var(--bg);
        }
        #room-ins-chat > .center > .pwl {
            background-color: var(--error);
        }
        #room-ins-chat > .center > .pww {
            background-color: var(--success);
        }


        #room-ins-chat > div {
            max-width: 80%;
        }
        #room-ins-chat > .right {
            align-self: flex-end;
        }
        #room-ins-chat > .other {
            align-self: flex-start;
        }
        #room-ins-chat > .center {
            align-self: center;
        }

        #room-ins-footer {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #room-ins-input-cont {
            display: flex;
            justify-content: space-between;
            flex: 1;
            align-items: center;
        }

        #room-ins-input {
            flex: 1;
        }


        

    </style>
</head>
<body>
    <div id="toast-messages-window" class="hidden">
        <div id="toast-messages">
            <!--
            <div class="toast success">
                <p>Mensagem de sucesso</p>
            </div>
            <div class="toast error">
                <p>Mensagem de erro</p>
            </div>
            <div class="toast info">
                <p>Mensagem informativa</p>
            </div>
            -->
        </div>
    </div>
    <div id="tela-main-page" class="tela ativa">
        <div id="tela-main">
            <div id="name-input-block">
                <div id="name-input-container">
                    <p>Nome</p>
                    <div>
                        <input id="name-input" type="text" placeholder="Seu nome..." />
                        <button id="name-submit" class="primary"> OK </button>
                    </div>
                </div>
            </div>
            <div id="room-list-block">
                <div id="room-list-container">
                    <div id="room-list-header">
                        <input type="text" id="room-name-input" placeholder="Nome da Sala" />
                        <button id="join-room" class="primary">Entrar</button>
                        <button id="create-room">Criar</button>
                        <button id="reload-rooms">Recarregar</button>
                    </div>
                    <div id="room-list-content">
                        <!-- Lista de salas
                        <div class="rl-room">
                            <div class="rl-room-info">
                                <p>Nome da Sala</p>
                                <div>
                                    <p>Jogador 1...</p>
                                </div>
                            </div>
                            <button> Entrar </button>
                        </div>
                        -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="tela-room-page" class="tela">
        <div id="tela-room">
            <div id="room-ins-header">
                <div class="room-header-content">
                    <p id="room-name">Nome da sala</p>
                    <span id="game-status" class="game-element">Jogo Ativo</span>
                </div>
            </div>
            <div id="room-ins-content">
                <div id="room-ins-gamestate">
                    <div id="room-ins-gs">
                        
                    </div>
                    <div id="room-ins-playertyping" class="game-element">

                    </div>
                </div>
                <div id="room-ins-game">
                    <div id="room-ins-players">
                        <!--
                        <p class="playing"> jogador2 </p>
                        <p> jogador3 </p>
                        <p class="me playing"> jogador1 </p>
                        <p> jogador2 </p>
                        <p class="me"> jogador4 </p>
                        -->
                    </div>
                    <div id="room-ins-chat">
                        <!--
                        <div class="right">
                            <p class="me"> minha mensagem </p>
                        </div>
                        <div class="center">
                            <p class="srv"> mensagem do servidor </p>
                        </div>
                        <div>
                            <p class="other"> mensagens de outros players </p>
                        </div>
                        -->
                    </div>
                </div>
            </div>
            <div id="room-ins-footer">
                <div id="room-ins-input-cont">
                    <p id="room-ins-gameletters" class="game-element"></p>
                    <input type="text" id="room-ins-input" placeholder="Digite uma mensagem..." />
                    <button id="room-ins-send" class="primary">Enviar</button>
                </div>
                <div id="room-ins-buttons">
                    <button id="room-ins-leaveroom"> Sair </button>
                    <button id="room-ins-startgame" class="primary"> Iniciar Jogo </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chat = document.getElementById("room-ins-chat");
        const gameState = document.getElementById("room-ins-gs");
        const playerTyping = document.getElementById("room-ins-playertyping");
        const startButton = document.getElementById("room-ins-startgame");
        const leaveRoomButton = document.getElementById("room-ins-leaveroom");
        const roomsButton = document.getElementById("reload-rooms");
        const roomPlayers = document.getElementById("room-ins-players");
        const createRoomButton = document.getElementById("create-room");
        
        const nameInputContainer = document.getElementById("name-input-container");
        const nameInput = document.getElementById("name-input");
        const setNameButton = document.getElementById("name-submit");

        const gameLetters = document.getElementById("room-ins-gameletters");
        const messageInput = document.getElementById("room-ins-input");
        const sendButton = document.getElementById("room-ins-send");        
        
        const roomNameP = document.getElementById("room-name");
        const roomNameInput = document.getElementById("room-name-input");
        const joinRoomButton = document.getElementById("join-room");
        
        
        const toastMessagesWindow = document.getElementById("toast-messages-window");
        const toastMessages = document.getElementById("toast-messages");

        function addToastMessage(message, type = "info") {
            const toast = document.createElement("div");
            toast.classList.add("toast", type);
            toast.textContent = message;

            toastMessages.appendChild(toast);
            toastMessagesWindow.classList.remove("hidden");

            setTimeout(() => {
                toast.remove();
                if (toastMessages.children.length === 0) {
                    toastMessagesWindow.classList.add("hidden");
                }
            }, 3000);
        }


        function changeTela() {
            const mainTela = document.getElementById("tela-main-page");
            const roomTela = document.getElementById("tela-room-page");

            if (mainTela.classList.contains("ativa")) {
                mainTela.classList.remove("ativa");
                roomTela.classList.add("ativa");
            } else {
                mainTela.classList.add("ativa");
                roomTela.classList.remove("ativa");
            }
        }


        let gameState_value = 0;
        let currentPlayingPid = null;
        let me = { id: -1, name: "Player" };
        let room_players = {
            // "player_id": { "name": "Player Name", "points": 0 }
        };

        let ws = null;        
        function wsOnOpen() {
            console.log("WS connected");
        }
        function wsOnClose() {
            console.log("WS disconnected");
            gameState_value = 0;
            setTimeout(setupWS, 3000);
        }
        function wsOnMesssage(event) {
            msg = JSON.parse(event.data);
            console.log("WS message received:", msg);
            switch (msg.t) {
                case "errtable": // Error table
                    ERRORTABLE = msg.e;
                    break;
                case "err": // Error message
                    handleError(msg.e)
                    break;
                case "rc": // Room chat message
                    addToRoomChat(msg.m, msg.f);
                    break;
                case "rl": // Room list
                    showRoomList(msg.r);
                    break;
                case "er": // Entering room
                    enterRoom(msg.r);
                    break;
                case "gl": // Game letters
                    showGameLetters(msg.l);
                    break;
                case "gs": // Game state update
                    updateGameState(msg.s, msg.p);
                    break;
                case "pp": // Player points update
                    updatePlayerPoints(msg.p, msg.pts);
                    break;
                case "pt": // Game text message
                    updatePlayerTyping(msg.m);
                    break;
                case "pw": // Player word message
                    showResultInChat(msg.m, msg.r);
                    break;
                case "id": // Identity message
                    setPlayerId(msg.p, msg.n);
                    break;
                case "pid": // Player IDs
                    player = { [msg.p]: msg.n };
                    modifyRoomPlayerList(player, false);
                    addToRoomChat(`O jogador ${msg.n} entrou na sala`, -1);
                    break;
                case "pids": // Player IDs
                    modifyRoomPlayerList(msg.p, false);
                    break;
                case "pl": // Player left
                    const playerName = room_players[msg.p].name;
                    addToRoomChat(`O jogador ${playerName} saiu da sala`, -1);
                    player = { [msg.p]: playerName };
                    modifyRoomPlayerList(player, true);
                    break;

            }
        }
        function setupWS() {
            // Define the WebSocket URL - can be changed for different environments
            const wsUrl = "ws://10.8.6.2:8085";
            ws = new WebSocket(wsUrl);
            ws.onopen = wsOnOpen;
            ws.onclose = wsOnClose;
            ws.onmessage = wsOnMesssage;
        }

        ERRORTABLE = {}
        async function handleError(err) {
            if (Object.keys(ERRORTABLE).length === 0) {
                await ws.send(fMsgToSend("command", "errtable"));
                await setTimeout(() => {
                    handleError(err);
                }, 1000);
                return;
            }
            addToastMessage(`${ERRORTABLE[err] || "Unknown error"}`, "error");
        }

        function setPlayerId(id, name) {
            me.id = id;
            me.name = name;
            nameInputContainer.innerHTML = `<p>Olá ${me.name} !</p>`;
            addToastMessage(`Olá ${me.name} !`, "success");
        }

        // User color mapping
        const userColors = {};
        let colorCounter = 0;
        
        function getUserColor(userId) {
            if (!userColors[userId]) {
                // Assign color and cycle through available colors (0-5)
                userColors[userId] = colorCounter % 6;
                colorCounter++;
            }
            return userColors[userId];
        }

        function addToRoomChat(msg, from) {
            const msgElement = document.createElement("p");
            const div = document.createElement("div");

            if (from == -1) {
                div.classList.add("center");
                msgElement.classList.add("srv");
                msgElement.textContent = msg;
            } else if (from >= 0) {
                div.classList.add("other");
                let playerName = room_players[from].name;
                msgElement.classList.add("other");
                
                // Add user-specific color class
                msgElement.classList.add(`user-color-${getUserColor(from)}`);
                
                // Add username with span for styling
                const usernameSpan = document.createElement("span");
                usernameSpan.className = "username";
                usernameSpan.textContent = playerName;
                msgElement.appendChild(usernameSpan);
                
                // Add message text
                msgElement.appendChild(document.createTextNode(msg));
            } else {
                div.classList.add("center");
                msgElement.classList.add("other");
                msgElement.textContent = msg;
            }

            div.appendChild(msgElement);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        };

        function showResultInChat(msg, result) {            
            const msgElement = document.createElement("p");
            const usernameSpan = document.createElement("span");
            usernameSpan.className = "username";
            usernameSpan.textContent = currentPlayingPid !== null && room_players[currentPlayingPid]
                ? room_players[currentPlayingPid].name
                : me.name;
            msgElement.appendChild(usernameSpan);

            msgElement.appendChild(document.createTextNode(msg));

            const div = document.createElement("div");
            div.classList.add("center");

            console.log("Result: ", result);
            switch (result) {
                case 1: // Player win 
                    msgElement.classList.add("pww");
                    break;
                case 0: // Player lose
                    msgElement.classList.add("pwl");
                    break;
            }

            updatePlayerTyping("");

            div.appendChild(msgElement);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function enterRoom(roomCode) {
            roomNameP.textContent = roomCode;
            if (roomCode == -1) {
                leavingRoom();
            }
            changeTela();
            // Initialize room with game-off state
            document.getElementById("tela-room").classList.add("game-off");
        }

        function leavingRoom() {
            chat.innerHTML = "";
            room_players = {};
            roomPlayers.innerHTML = "";
            playerTyping.textContent = "...";
            updateGameState(0);
        }

        function showRoomList(rooms) {
            const roomListContent = document.getElementById("room-list-content");
            roomListContent.innerHTML = "";

            for (const [roomCode, players] of Object.entries(rooms)) {
                const room = document.createElement("div");
                room.classList.add("rl-room");

                const roomInfo = document.createElement("div");
                roomInfo.classList.add("rl-room-info");

                const rcode = document.createElement("p");
                rcode.textContent = roomCode;

                const playerDiv = document.createElement("div");
                for (const player of players) {
                    const p = document.createElement("p");
                    p.textContent = player;
                    playerDiv.appendChild(p);
                }

                roomInfo.appendChild(rcode);
                roomInfo.appendChild(playerDiv);
                room.appendChild(roomInfo);

                const joinButton = document.createElement("button");
                joinButton.textContent = "Entrar";
                joinButton.classList.add("primary");
                joinButton.onclick = () => {
                    ws.send(fMsgToSend("command", roomCode, "join"));
                };

                room.appendChild(joinButton);
                roomListContent.appendChild(room);
            }
        }

        function showGameLetters(letters) {
            gameLetters.textContent = letters;
            addToRoomChat(`As letras escolhidas são: ${letters}`, -1);
        }

        function refreshRoomPlayers(playing_pid = -1) {            
            roomPlayers.innerHTML = "";
            Object.entries(room_players).forEach(([pid, player]) => {
                const p = document.createElement("p");
                let name = player.name;
                let points = player.points || 0;

                if (name.length > 5) {
                    name = name.substring(0, 5) + "...";
                }
                p.textContent = `${name}: ${points}`;
                if (pid == me.id) {
                    p.classList.add("me");
                }
                if (pid == playing_pid) {
                    p.classList.add("playing");
                }
                roomPlayers.appendChild(p);
            });
        }

        function modifyRoomPlayerList(pids, remover = false) {
            if (remover) {
                Object.entries(pids).forEach(([pid, name]) => {
                    delete room_players[pid];
                });
            } else {
                Object.entries(pids).forEach(([pid, name]) => {
                    if (!room_players[pid]) {
                        room_players[pid] = {"name": name, "points": 0 };
                    } else {
                        room_players[pid].name = name;
                    }
                });
            }

            refreshRoomPlayers();
        }

        function updatePlayerPoints(pid, points) {
            if (room_players[pid]) {
                room_players[pid].points = points;
                refreshRoomPlayers();
            }
        }

        function updatePlayerTyping(typing) {
            if (typing.length > 0) {
                playerTyping.textContent = typing;
            } else {
                playerTyping.textContent = "...";
            }
        }

        function updateGameState(state, pid_chosen = null) {
            const roomElement = document.getElementById("tela-room");
            currentPlayingPid = state === 3 ? pid_chosen : null;
            
            if (gameState_value == 0 && state == 1) {                
                // Resetar as pontuações dos jogadores
                console.log("players: ", room_players);
                Object.entries(room_players).forEach(([pid, player]) => {
                    player.points = 0;
                });
                refreshRoomPlayers();
                addToRoomChat("Iniciando jogo...", -1);
                
                // Show game UI when game starts
                roomElement.classList.remove("game-off");
            }

            gameState_value = state;

            switch (state) {
                case 0:
                    // Hide game elements when game is inactive
                    roomElement.classList.add("game-off");
                    
                    gameState.textContent = "Chat da Sala";
                    playerTyping.textContent = "";                    
                    gameLetters.innerHTML = "";
                    refreshRoomPlayers();
                    
                    // Update input placeholder for chat mode
                    messageInput.placeholder = "Digite uma mensagem...";
                    break;
                case 1:
                    // Show game elements
                    roomElement.classList.remove("game-off");
                    
                    gameState.textContent = "Iniciando jogo...";
                    
                    // Update input placeholder for game mode
                    messageInput.placeholder = "Digite uma palavra...";
                    break;
                case 2:
                    gameState.textContent = "Escolhendo jogador...";
                    break;
                case 3:
                    gameState.textContent = "Jogo em andamento...";
                    if (pid_chosen !== null) {
                        if (pid_chosen == me.id) {
                            gameState.textContent = "Sua vez!";
                            gameState_value = 4;
                            addToastMessage("Você é o jogador escolhido!", "info");
                        } else {
                            const playerName = room_players[pid_chosen].name;
                            gameState.textContent = playerName + " está jogando.";
                        }
                        refreshRoomPlayers(pid_chosen);
                    }
                    break;
            }
        }

        function fMsgToSend(type, msg, comm) {
            if (comm) msg = `${comm}:${msg}`;
            switch (type) {
                case "command":
                    return JSON.stringify({ c: msg });
                case "roomchat":
                    return JSON.stringify({ r: msg });
                case "gamemsg":
                    return JSON.stringify({ g: msg });
            }
        }

        setupWS();

        // Envia o que o usuario estiver digitando em tempo real
        messageInput.oninput = () => {
            if (gameState_value == 4) {
                const msg = messageInput.value;
                ws.send(fMsgToSend("gamemsg", msg, "t"));
            }
        };

        messageInput.onkeyup = (event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                sendButton.click();
            }
        };

        // Iniciar o jogo
        startButton.onclick = () => {
            ws.send(fMsgToSend("gamemsg", "start"));
        };


        nameInput.onkeyup = (event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                setNameButton.click();
            }
        };

        // Definir o nome do usuário
        setNameButton.onclick = () => {
            const name = nameInput.value.trim();
            if (name.length < 4 || name.length > 10) {
                addToastMessage("Nome deve ter entre 4 e 10 caracteres", "error");
                return;
            }
            if (name) {
                ws.send(fMsgToSend("command", name, "me"));
            }
        };

        // Listar as salas
        roomsButton.onclick = () => {
            ws.send(fMsgToSend("command", "rooms"));
        };

        // Criar uma sala
        createRoomButton.onclick = () => {
            const roomName = roomNameInput.value.trim();
            if (roomName.length < 8 || roomName.length > 20) {
                addToastMessage("Nome da sala deve ter entre 8 e 20 caracteres", "error");
                return;
            }
            if (roomName) {
                ws.send(fMsgToSend("command", roomName, "create"));
            }
        };

        // Entrar em uma sala
        joinRoomButton.onclick = () => {
            const roomName = roomNameInput.value.trim();
            if (roomName) {
                ws.send(fMsgToSend("command", roomName, "join"));
            }
        };

        // Sair da sala
        leaveRoomButton.onclick = () => {
            ws.send(fMsgToSend("roomchat", "leave"));
        };

        sendButton.onclick = () => {
            const msg = messageInput.value.trim();
            if (msg.length === 0) return;

            if (gameState_value == 4) {
                ws.send(fMsgToSend("gamemsg", msg, "m"));
            } else {
                ws.send(fMsgToSend("roomchat", msg, "c"));            
                const msgElement = document.createElement("p");
                msgElement.classList.add("me");
                
                // Add my username with span for styling
                const usernameSpan = document.createElement("span");
                usernameSpan.className = "username";
                usernameSpan.textContent = me.name;
                msgElement.appendChild(usernameSpan);
                
                // Add message text
                msgElement.appendChild(document.createTextNode(msg));

                const div = document.createElement("div");
                div.classList.add("right");
                div.appendChild(msgElement);
                chat.appendChild(div);
            }
            chat.scrollTop = chat.scrollHeight;

            messageInput.value = "";
        };
    </script>
</body>
</html>
